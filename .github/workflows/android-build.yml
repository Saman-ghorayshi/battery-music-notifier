name: android-build

on:
  push:
    branches: [master, "v2.1*"]
    paths: ["android/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK + run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Smoke test (JVM-only classes compile)
        run: ./gradlew --no-daemon compileDebugKotlin

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-music-notifier-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
