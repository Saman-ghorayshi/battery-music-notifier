name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Unit tests only: live worker/Telegram integration is marked `live`
      # and excluded by default via pyproject addopts. Belt and suspenders:
      # the explicit -m here guarantees it even if addopts change.
      - name: Run unit tests
        run: pytest -m "not live" -v

  supply-chain:
    runs-on: ubuntu-latest
    continue-on-error: true # warn-first; promote to blocking after triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (python deps)
        run: |
          pip install -q pip-audit
          pip-audit -r requirements.txt --desc off || true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (relay-node runtime deps)
        working-directory: relay-node
        run: |
          npm install --omit=dev --no-audit --no-fund >/dev/null 2>&1 || true
          npm audit --omit=dev || true
