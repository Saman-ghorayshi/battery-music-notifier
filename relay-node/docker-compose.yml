services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battery}
      POSTGRES_DB: battery
    ports:
      # NOT 5432: dev machines often run their own postgres (WSL2, supabase etc.)
      # and localhost:5432 would silently hit that one instead of ours.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battery -d battery"]
      interval: 3s
      timeout: 3s
      retries: 15

  relay:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://battery:${POSTGRES_PASSWORD:-battery}@db:5432/battery
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env (min 10 chars)}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - "8787:8787"
    # Migrations run first via: docker compose run --rm relay npm run migrate
    restart: unless-stopped

volumes:
  pgdata:
